<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 自定义标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-title">🍅 番茄钟</span>
    </div>
    <div class="titlebar-btns">
      <button class="tb-btn" id="btnTop" title="窗口置顶">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6-6 6 6"/><path d="M6 21h12"/><path d="M12 15v6"/></svg>
      </button>
      <button class="tb-btn" id="btnMin" title="最小化">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="tb-btn tb-close" id="btnClose" title="关闭到托盘">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="app">
    <!-- 模式切换 -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="work">🍅 专注</button>
      <button class="tab" data-mode="shortBreak">☕ 短休息</button>
      <button class="tab" data-mode="longBreak">🌿 长休息</button>
    </div>

    <!-- 计时环 -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="105"/>
        <circle class="ring-fg" id="ring" cx="120" cy="120" r="105"
          transform="rotate(-90 120 120)"/>
      </svg>
      <div class="time" id="timeDisplay">
        <span class="time-m" id="mm">25</span>
        <span class="time-sep">:</span>
        <span class="time-s" id="ss">00</span>
      </div>
    </div>

    <!-- 状态 -->
    <div class="status" id="status">准备开始专注</div>

    <!-- 按钮 -->
    <div class="controls">
      <button class="btn btn-play" id="btnPlay">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <span>开始</span>
      </button>
      <button class="btn btn-pause" id="btnPause" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
        <span>暂停</span>
      </button>
      <button class="btn btn-reset" id="btnReset">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.5 15.5A9 9 0 1 0 2 12"/></svg>
        <span>重置</span>
      </button>
    </div>

    <!-- 统计 -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="cntSessions">0</div>
        <div class="stat-lbl">今日番茄</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="cntMinutes">0 min</div>
        <div class="stat-lbl">今日专注</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="cntStreak">0</div>
        <div class="stat-lbl">连续天数</div>
      </div>
    </div>

    <!-- 快捷键 -->
    <div class="hint">
      <kbd>Space</kbd> 开始/暂停 &nbsp; <kbd>R</kbd> 重置 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换模式
    </div>
  </div>

  <!-- 完成遮罩 -->
  <div class="overlay" id="overlay">
    <div class="overlay-inner">
      <div class="overlay-emoji" id="ovEmoji">🎉</div>
      <div class="overlay-text" id="ovText">太棒了！</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
