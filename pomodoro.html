<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
/* ===== 基础变量 ===== */
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --text: #eee;
  --text2: #a0a0b0;
  --text3: #666;
  --green: #2ecc71;
  --card: rgba(255,255,255,0.04);
  --hover: rgba(255,255,255,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

/* ===== 主卡片 ===== */
.app {
  width: 400px;
  padding: 36px 32px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

/* ===== 头部 ===== */
.header {
  text-align: center;
}
.header-icon {
  font-size: 36px;
  margin-bottom: 4px;
}
.header-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}

/* ===== 模式切换 ===== */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 4px;
  gap: 2px;
  width: 100%;
}
.tab {
  flex: 1;
  padding: 9px 6px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.25s ease;
  white-space: nowrap;
  font-family: inherit;
}
.tab:hover { color: var(--text2); }
.tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px rgba(233,69,96,0.35);
}
.tab:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== 计时环 ===== */
.ring-wrap {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ring-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.ring-bg {
  stroke: rgba(255,255,255,0.08);
  fill: none;
  stroke-width: 8;
}
.ring-fg {
  stroke: var(--accent);
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease;
}
.ring-fg.break { stroke: var(--green); }
.ring-fg.urgent { stroke: #ff4757; }

/* ===== 时间显示 ===== */
.time {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.time-m, .time-s {
  font-size: 56px;
  font-weight: 700;
  font-family: 'SF Mono','JetBrains Mono','Consolas','Menlo',monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  min-width: 72px;
  text-align: center;
  transition: color 0.3s;
}
.time-sep {
  font-size: 48px;
  font-weight: 300;
  color: var(--text2);
  margin-bottom: 4px;
}
.running .time-sep { animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.urgent .time-m, .urgent .time-s {
  color: var(--accent);
  animation: pulse 0.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

/* ===== 状态文字 ===== */
.status {
  font-size: 15px;
  font-weight: 500;
  color: var(--text2);
  min-height: 22px;
  text-align: center;
}

/* ===== 按钮 ===== */
.controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 22px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s ease;
  font-family: inherit;
}
.btn:active { transform: scale(0.96); }

.btn-play {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px rgba(233,69,96,0.35);
}
.btn-play:hover {
  background: var(--accent-light);
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(233,69,96,0.45);
}
.btn-pause {
  background: rgba(255,255,255,0.1);
  color: var(--text);
}
.btn-pause:hover {
  background: rgba(255,255,255,0.16);
  transform: translateY(-1px);
}
.btn-reset {
  background: transparent;
  color: var(--text2);
  padding: 11px 14px;
}
.btn-reset:hover {
  color: var(--text);
  background: var(--hover);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ===== 统计 ===== */
.stats {
  display: flex;
  width: 100%;
  background: var(--card);
  border-radius: 12px;
  padding: 4px;
}
.stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 8px;
  border-radius: 10px;
  transition: 0.2s;
  cursor: default;
}
.stat:hover { background: var(--hover); }
.stat-val {
  font-size: 22px;
  font-weight: 700;
  font-family: 'SF Mono','JetBrains Mono','Consolas',monospace;
  font-variant-numeric: tabular-nums;
}
.stat-lbl {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
}

/* ===== 完成遮罩 ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.overlay.show {
  opacity: 1;
  pointer-events: all;
  cursor: pointer;
}
.overlay-inner {
  text-align: center;
  animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn {
  0% { transform:scale(0.5); opacity:0; }
  100% { transform:scale(1); opacity:1; }
}
.overlay-emoji { font-size: 64px; margin-bottom: 12px; }
.overlay-text { font-size: 22px; font-weight: 700; color: #fff; }

/* ===== 提示文字 ===== */
.hint {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  line-height: 1.6;
}
.hint kbd {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 11px;
  border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<div class="app">
  <!-- 头部 -->
  <div class="header">
    <div class="header-icon">🍅</div>
    <div class="header-title">番茄钟</div>
  </div>

  <!-- 模式切换 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="work">🍅 专注</button>
    <button class="tab" data-mode="shortBreak">☕ 短休息</button>
    <button class="tab" data-mode="longBreak">🌿 长休息</button>
  </div>

  <!-- 计时环 -->
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="105"/>
      <circle class="ring-fg" id="ring" cx="120" cy="120" r="105"
        transform="rotate(-90 120 120)"/>
    </svg>
    <div class="time">
      <span class="time-m" id="mm">25</span>
      <span class="time-sep">:</span>
      <span class="time-s" id="ss">00</span>
    </div>
  </div>

  <!-- 状态 -->
  <div class="status" id="status">准备开始专注</div>

  <!-- 按钮 -->
  <div class="controls">
    <button class="btn btn-play" id="btnPlay" title="开始 (空格键)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      <span>开始</span>
    </button>
    <button class="btn btn-pause" id="btnPause" disabled title="暂停 (空格键)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
      <span>暂停</span>
    </button>
    <button class="btn btn-reset" id="btnReset" title="重置 (R键)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.5 15.5A9 9 0 1 0 2 12"/></svg>
      <span>重置</span>
    </button>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="cntSessions">0</div>
      <div class="stat-lbl">今日番茄</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="cntMinutes">0 min</div>
      <div class="stat-lbl">今日专注</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="cntStreak">0</div>
      <div class="stat-lbl">连续天数</div>
    </div>
  </div>

  <!-- 快捷键提示 -->
  <div class="hint">
    <kbd>空格</kbd> 开始/暂停 &nbsp; <kbd>R</kbd> 重置 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换模式
  </div>
</div>

<!-- 完成遮罩 -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-emoji" id="ovEmoji">🎉</div>
    <div class="overlay-text" id="ovText">太棒了！</div>
  </div>
</div>

<script>
// ==================== 番茄钟核心逻辑 ====================

const R = 105;
const CIRCUM = 2 * Math.PI * R; // 659.73

// 配置
const MODES = {
  work:       { min: 25, emoji: '🍅', label: '专注中...', endEmoji: '🎉', endText: '专注完成！休息一下吧~' },
  shortBreak: { min: 5,  emoji: '☕', label: '休息中...', endEmoji: '☕', endText: '休息结束，继续加油！' },
  longBreak:  { min: 15, emoji: '🌿', label: '放松中...', endEmoji: '🌿', endText: '休息结束，开始新的番茄！' },
};

// DOM
const $ = id => document.getElementById(id);
const elRing = $('ring');
const elMm = $('mm');
const elSs = $('ss');
const elStatus = $('status');
const elBtnPlay = $('btnPlay');
const elBtnPause = $('btnPause');
const elBtnReset = $('btnReset');
const elOverlay = $('overlay');
const elOvEmoji = $('ovEmoji');
const elOvText = $('ovText');
const elCntSessions = $('cntSessions');
const elCntMinutes = $('cntMinutes');
const elCntStreak = $('cntStreak');
const elBody = document.body;
const elTabs = document.querySelectorAll('.tab');

// 状态
let mode = 'work';
let timeLeft = MODES.work.min * 60;
let totalSec = MODES.work.min * 60;
let timerId = null;
let running = false;
let sessionsToday = 0;
let minutesToday = 0;
let streakDays = 0;

// ===== 音频 =====
let ctx = null;
function ac() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  return ctx;
}
function beep(freq, dur, type='sine', vol=0.3) {
  try {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime);
    o.stop(c.currentTime + dur);
  } catch(_) {}
}
function playComplete() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sine', 0.25), i * 120));
}
function playTick() { beep(800, 0.06, 'sine', 0.12); }

// ===== 通知 =====
function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, silent: false });
  }
}
function requestNotify() {
  if ('Notification' in window && Notification.permission === 'default') {
    // 首次用户交互时请求
    Notification.requestPermission();
  }
}

// ===== 显示更新 =====
function updateTime() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  elMm.textContent = String(m).padStart(2, '0');
  elSs.textContent = String(s).padStart(2, '0');
}
function updateRing() {
  const pct = timeLeft / totalSec;
  elRing.style.strokeDasharray = CIRCUM;
  elRing.style.strokeDashoffset = CIRCUM * (1 - pct);
  // 模式颜色
  elRing.classList.toggle('break', mode !== 'work');
  elRing.classList.toggle('urgent', running && timeLeft <= 10 && timeLeft > 0);
}
function updateUrgent() {
  elBody.classList.toggle('urgent', running && timeLeft <= 10 && timeLeft > 0);
  if (running && timeLeft <= 5 && timeLeft > 0) playTick();
}

// ===== 按钮状态 =====
function updateBtns() {
  if (running) {
    elBtnPlay.style.display = 'none';
    elBtnPause.style.display = 'flex';
    elBtnPause.disabled = false;
    elBody.classList.add('running');
  } else {
    elBtnPlay.style.display = 'flex';
    elBtnPause.style.display = 'none';
    elBtnPause.disabled = true;
    elBody.classList.remove('running');
    elBody.classList.remove('urgent');
  }
  // 模式标签
  elTabs.forEach(t => {
    t.disabled = running;
    t.classList.toggle('active', t.dataset.mode === mode);
  });
}

// ===== 状态文字 =====
function setStatus(text) { elStatus.textContent = text; }

// ===== 计时器完成 =====
function complete() {
  clearInterval(timerId);
  timerId = null;
  running = false;

  playComplete();

  if (mode === 'work') {
    // 工作完成
    sessionsToday++;
    minutesToday += MODES.work.min;
    save();
    showOverlay(MODES.work.endEmoji, MODES.work.endText);
    notify('🍅 番茄钟', '专注时间结束！休息一下吧~');
    switchMode('shortBreak');
    reset(true);
  } else {
    // 休息完成
    showOverlay(MODES[mode].endEmoji, MODES[mode].endText);
    notify('🍅 番茄钟', '休息结束，准备开始新的番茄！');
    switchMode('work');
    reset(true);
  }
  updateBtns();
}

// ===== 操作 =====
function start() {
  if (timeLeft <= 0) reset(false);
  ac(); // 解锁音频
  requestNotify();

  running = true;
  updateBtns();
  setStatus(MODES[mode].label);

  timerId = setInterval(() => {
    timeLeft--;
    updateTime();
    updateRing();
    updateUrgent();
    if (timeLeft <= 0) complete();
  }, 1000);
}

function pause() {
  running = false;
  clearInterval(timerId);
  timerId = null;
  updateBtns();
  setStatus('已暂停 ⏸');
}

function reset(silent) {
  running = false;
  clearInterval(timerId);
  timerId = null;
  timeLeft = MODES[mode].min * 60;
  totalSec = timeLeft;
  updateTime();
  updateRing();
  updateBtns();
  if (!silent) setStatus(defaultStatus());
}

function switchMode(m) {
  mode = m;
  timeLeft = MODES[m].min * 60;
  totalSec = timeLeft;
  updateTime();
  updateRing();
  updateBtns();
  if (!running) setStatus(defaultStatus());
}

function defaultStatus() {
  const c = MODES[mode];
  return mode === 'work' ? '准备开始专注' : `${c.emoji} ${c.label} (${c.min}分钟)`;
}

// ===== 完成遮罩 =====
function showOverlay(emoji, text) {
  elOvEmoji.textContent = emoji;
  elOvText.textContent = text;
  elOverlay.classList.add('show');
  setTimeout(() => elOverlay.classList.remove('show'), 2500);
}

// ===== 持久化 =====
const SK = 'pomodoro_v2';
function load() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const raw = localStorage.getItem(SK);
    const d = raw ? JSON.parse(raw) : {};

    if (d.date === today) {
      sessionsToday = d.sessions || 0;
      minutesToday = d.focus || 0;
    }
    // 连续天数计算
    if (d.date) {
      const last = new Date(d.date);
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (last.toISOString().slice(0, 10) === yesterday.toISOString().slice(0, 10)) {
        streakDays = (d.streak || 0) + 1;
      } else if (d.date !== today) {
        streakDays = 0;
      } else {
        streakDays = d.streak || 0;
      }
    }
    if (sessionsToday > 0 && streakDays === 0) streakDays = 1;
    updateStats();
  } catch(_) {}
}
function save() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const raw = localStorage.getItem(SK);
    const d = raw ? JSON.parse(raw) : {};
    const prevDate = d.date;
    let streak = d.streak || 0;

    if (prevDate && prevDate !== today) {
      const last = new Date(prevDate);
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (last.toISOString().slice(0, 10) === yesterday.toISOString().slice(0, 10)) {
        streak += 1;
      } else {
        streak = 1;
      }
    } else {
      streak = Math.max(streak, 1);
    }

    localStorage.setItem(SK, JSON.stringify({
      date: today, sessions: sessionsToday, focus: minutesToday, streak
    }));
    streakDays = streak;
    updateStats();
  } catch(_) {}
}
function updateStats() {
  elCntSessions.textContent = sessionsToday;
  elCntMinutes.textContent = minutesToday + ' min';
  elCntStreak.textContent = streakDays;
}

// ===== 事件绑定 =====
elBtnPlay.addEventListener('click', start);
elBtnPause.addEventListener('click', pause);
elBtnReset.addEventListener('click', () => reset(false));

elOverlay.addEventListener('click', () => elOverlay.classList.remove('show'));

elTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    if (!running && tab.dataset.mode !== mode) {
      switchMode(tab.dataset.mode);
    }
  });
});

// ===== 键盘快捷键 =====
document.addEventListener('keydown', e => {
  // 忽略输入框中的按键
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      running ? pause() : start();
      break;
    case 'KeyR':
      if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); reset(false); }
      break;
    case 'Digit1':
      if (!e.ctrlKey && !e.metaKey && !running) { e.preventDefault(); switchMode('work'); }
      break;
    case 'Digit2':
      if (!e.ctrlKey && !e.metaKey && !running) { e.preventDefault(); switchMode('shortBreak'); }
      break;
    case 'Digit3':
      if (!e.ctrlKey && !e.metaKey && !running) { e.preventDefault(); switchMode('longBreak'); }
      break;
  }
});

// ===== 初始化 =====
function init() {
  updateTime();
  updateRing();
  updateBtns();
  setStatus(defaultStatus());
  load();
}
init();
</script>

</body>
</html>
